{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <div class="text-center">

        <h1>Bienvenido al sistema</h1>

        <p class="mt-3">
            Has iniciado sesión como:
            <strong>{{ current_user.usuario }}</strong>
        </p>

        <a href="{{ url_for('productos') }}" class="btn btn-primary mt-3">
            Ir a productos
        </a>

        <a href="{{ url_for('logout') }}" class="btn btn-danger mt-3">
            Cerrar sesión
        </a>

    </div>

</div>

{% endblock %}
