{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-body">

                    <h2 class="text-center mb-4">
                        Crear cuenta
                    </h2>

                    <form method="POST">

                        <div class="mb-3">
                            <label for="usuario" class="form-label">
                                Usuario
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="usuario"
                                name="usuario"
                                required>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">
                                Contraseña
                            </label>

                            <input
                                type="password"
                                class="form-control"
                                id="password"
                                name="password"
                                required>
                        </div>

                        <div class="mb-3">
                            <label for="confirmar_password" class="form-label">
                                Confirmar contraseña
                            </label>

                            <input
                                type="password"
                                class="form-control"
                                id="confirmar_password"
                                name="confirmar_password"
                                required>
                        </div>

                        <button
                            type="submit"
                            class="btn btn-primary w-100">
                            Registrarse
                        </button>

                    </form>

                    <div class="text-center mt-3">
                        <a href="{{ url_for('login') }}">
                            ¿Ya tienes una cuenta? Inicia sesión
                        </a>
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
